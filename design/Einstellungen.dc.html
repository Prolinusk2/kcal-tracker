<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Einstellungen – Kcal Tracker</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #EEF1EC; color: #121A15; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden">

<div style="padding: 50px 20px 0; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">Einstellungen</h1>
<button onClick="{{save}}" style="height: 40px; padding: 0 16px; border-radius: 20px; border: 0; background: {{saveBg}}; color: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px">{{saveLabel}}</button>
</header>

<section aria-labelledby="ki-title" style="background: #FFFFFF; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; align-items: center; gap: 10px">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #DCEFE2; color: #1F5E3A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9.5l-4.7 1.9L12 16l-1.8-4.6L5.5 9.5l4.7-1.9Z"></path><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8Z"></path></svg></span>
<div style="display: flex; flex-direction: column; gap: 1px">
<h2 id="ki-title" style="margin: 0; font-size: 16px; font-weight: 700">KI-Erkennung</h2>
<div style="font-size: 12px; color: #56625A">Über OpenRouter</div>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="api-key" style="font-size: 13px; font-weight: 600">API-Key</label>
<div style="display: flex; align-items: center; height: 48px; border-radius: 14px; background: #F3F5F2; border: 1.5px solid #D5DDD7; box-sizing: border-box; padding: 0 4px 0 12px; gap: 6px">
<input id="api-key" type="{{keyType}}" value="{{apiKey}}" onChange="{{onKey}}" placeholder="sk-or-…" autocomplete="off" spellcheck="false" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px; color: #121A15">
<button aria-label="{{eyeLabel}}" onClick="{{toggleKey}}" style="width: 40px; height: 40px; border-radius: 10px; border: 0; background: transparent; color: #3E4A42; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<sc-if value="{{showKey}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a16 16 0 0 1-2.6 3.2M6.5 7.6C4.3 9.2 3 12 3 12s4 6 9 6c1.6 0 3-.4 4.3-1.1M9.9 10a3 3 0 0 0 4.2 4.2"></path></svg>
</sc-if>
<sc-if value="{{hideKey}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12s4-6 9-6 9 6 9 6-4 6-9 6-9-6-9-6Z"></path><circle cx="12" cy="12" r="3"></circle></svg>
</sc-if>
</button>
</div>
<div style="font-size: 12px; color: #56625A">Deinen Key bekommst du unter openrouter.ai › Keys. Er bleibt auf deinem Gerät.</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px">
<label for="model" style="font-size: 13px; font-weight: 600">Modell</label>
<div style="display: flex; align-items: center; height: 48px; border-radius: 14px; background: #F3F5F2; border: 1.5px solid #D5DDD7; box-sizing: border-box; padding: 0 12px">
<input id="model" type="text" value="{{model}}" onChange="{{onModel}}" placeholder="anbieter/modell-name" autocomplete="off" spellcheck="false" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 14px; color: #121A15">
</div>
<div style="font-size: 12px; color: #56625A">Die Modell-ID genau so, wie sie bei OpenRouter steht.</div>
</div>
</section>

<section aria-labelledby="ziele-title" style="background: #FFFFFF; border-radius: 22px; padding: 16px 16px 6px; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px; padding-bottom: 8px">
<span style="width: 32px; height: 32px; border-radius: 10px; background: #FCEBD8; color: #9A5412; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg></span>
<h2 id="ziele-title" style="margin: 0; font-size: 16px; font-weight: 700">Ziele</h2>
</div>
<sc-for list="{{goals}}" as="g" hint-placeholder-count="5">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; border-top: 1px solid #E6EBE7; min-height: 50px">
<label for="{{g.id}}" style="font-size: 14px; font-weight: 500">{{g.label}}</label>
<div style="display: flex; align-items: center; gap: 6px; height: 38px; width: 128px; border-radius: 12px; background: #F3F5F2; border: 1.5px solid #D5DDD7; box-sizing: border-box; padding: 0 10px">
<input id="{{g.id}}" type="number" inputmode="numeric" value="{{g.value}}" onChange="{{g.onChange}}" style="flex-grow: 1; min-width: 0; width: 60px; border: 0; outline: none; background: transparent; font-family: 'DM Sans', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #121A15; text-align: right">
<span style="font-size: 13px; color: #56625A; width: 30px">{{g.unit}}</span>
</div>
</div>
</sc-for>
</section>
</div>

<nav aria-label="Hauptmenü" style="position: absolute; left: 12px; right: 12px; bottom: 20px; height: 68px; border-radius: 24px; background: #121A15; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 6px; box-sizing: border-box">
<div style="display: flex; justify-content: center">
<button aria-label="Essen hinzufügen" onClick="{{goAdd}}" style="width: 54px; height: 54px; border-radius: 19px; border: 0; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<button onClick="{{goHome}}" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3AFA7; font-family: 'DM Sans', system-ui, sans-serif; font-size: 11px; font-weight: 500; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg>Heute</button>
<button onClick="{{goDiary}}" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3AFA7; font-family: 'DM Sans', system-ui, sans-serif; font-size: 11px; font-weight: 500; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"></path><path d="M9 9h6M9 13h6"></path></svg>Tagebuch</button>
<button aria-current="page" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg><span style="font-size: 10px; white-space: nowrap">Einstellungen</span></button>
</nav>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4A","options":["#1F7A4A","#2F5FC4","#D2552F","#121A15"]},"onHome":{"editor":null},"onDiary":{"editor":null},"onAdd":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
apiKey: '',
model: '',
showKey: false,
saved: false,
goals: { kcal: '2200', tol: '200', p: '140', c: '250', f: '70' }
};
}
renderVals() {
const accent = this.props.accent ?? '#1F7A4A';
const call = (fn, arg) => () => { if (typeof fn === 'function') fn(arg); };
const val = (e) => (e && e.target ? e.target.value : '');
const defs = [
['kcal', 'Tagesziel', 'kcal'],
['tol', 'Spielraum (±)', 'kcal'],
['p', 'Eiweiß', 'g'],
['c', 'Kohlenhydrate', 'g'],
['f', 'Fett', 'g']
];
const goals = defs.map(([k, label, unit]) => ({
id: 'goal-' + k,
label,
unit,
value: this.state.goals[k],
onChange: (e) => this.setState({ saved: false, goals: { ...this.state.goals, [k]: val(e) } })
}));
return {
accent,
goals,
apiKey: this.state.apiKey,
model: this.state.model,
keyType: this.state.showKey ? 'text' : 'password',
showKey: this.state.showKey,
hideKey: !this.state.showKey,
eyeLabel: this.state.showKey ? 'Key verbergen' : 'Key anzeigen',
onKey: (e) => this.setState({ apiKey: val(e), saved: false }),
onModel: (e) => this.setState({ model: val(e), saved: false }),
toggleKey: () => this.setState({ showKey: !this.state.showKey }),
save: () => this.setState({ saved: true }),
saveLabel: this.state.saved ? 'Gespeichert ✓' : 'Speichern',
saveBg: this.state.saved ? '#3E4A42' : accent,
goHome: call(this.props.onHome),
goDiary: call(this.props.onDiary),
goAdd: call(this.props.onAdd, 2)
};
}
}
</script>
</body>
</html>
