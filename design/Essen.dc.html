<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Essen hinzufügen – Kcal Tracker</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #EEF1EC; color: #121A15; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden">

<div style="padding: 50px 20px 0; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
<button aria-label="Schließen" onClick="{{close}}" style="width: 44px; height: 44px; border-radius: 22px; border: 0; background: #FFFFFF; color: #121A15; display: flex; align-items: center; justify-content: center; flex-shrink: 0; cursor: pointer">
<svg aria-hidden="true" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg>
</button>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 22px; font-weight: 700; letter-spacing: -0.01em">Essen hinzufügen</h1>
<div style="width: 44px; flex-shrink: 0"></div>
</header>

<div role="radiogroup" aria-label="Mahlzeit" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 4px; background: #FFFFFF; border-radius: 16px; padding: 4px">
<button role="radio" aria-checked="{{c0}}" onClick="{{m0}}" style="height: 40px; border: 0; border-radius: 12px; background: {{b0}}; color: {{f0}}; font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Frühstück</button>
<button role="radio" aria-checked="{{c1}}" onClick="{{m1}}" style="height: 40px; border: 0; border-radius: 12px; background: {{b1}}; color: {{f1}}; font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Mittag</button>
<button role="radio" aria-checked="{{c2}}" onClick="{{m2}}" style="height: 40px; border: 0; border-radius: 12px; background: {{b2}}; color: {{f2}}; font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Abend</button>
<button role="radio" aria-checked="{{c3}}" onClick="{{m3}}" style="height: 40px; border: 0; border-radius: 12px; background: {{b3}}; color: {{f3}}; font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Snack</button>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: #1F5E3A">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9.5l-4.7 1.9L12 16l-1.8-4.6L5.5 9.5l4.7-1.9Z"></path><path d="M19 15l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8Z"></path></svg>
Einfach eintippen, was du gegessen hast
</div>
<div style="display: flex; gap: 10px">
<label style="flex-grow: 1; min-height: 52px; border-radius: 16px; background: #FFFFFF; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 14px; box-sizing: border-box; border: 1.5px solid {{accent}}">
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Was hast du gegessen?</span>
<input type="text" value="{{text}}" onChange="{{onType}}" onKeyDown="{{onKey}}" placeholder="z. B. 2 Brötchen mit Käse und Kaffee" style="flex-grow: 1; min-width: 0; border: 0; outline: none; background: transparent; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; color: #121A15">
<button aria-label="Senden" onClick="{{send}}" style="width: 40px; height: 40px; border-radius: 12px; border: 0; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</button>
</label>
<button aria-label="Barcode scannen" style="width: 52px; height: 52px; border-radius: 16px; border: 0; background: #121A15; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7V5a2 2 0 0 1 2-2h2M17 3h2a2 2 0 0 1 2 2v2M21 17v2a2 2 0 0 1-2 2h-2M7 21H5a2 2 0 0 1-2-2v-2M7 8v8M10.5 8v8M14 8v8M17 8v8"></path></svg>
</button>
</div>
</div>

<button style="height: 48px; border: 0; border-radius: 16px; background: #FFFFFF; color: #121A15; display: flex; align-items: center; gap: 10px; padding: 0 14px; cursor: pointer; font-family: 'DM Sans', system-ui, sans-serif; font-size: 14px; font-weight: 600">
<span style="width: 30px; height: 30px; border-radius: 10px; background: #E4E2F4; color: #4A3E8F; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"></path></svg></span>Kcal manuell eingeben</button>

<sc-if value="{{showChat}}" hint-placeholder-val="{{ false }}">
<section aria-label="KI-Ergebnis" style="display: flex; flex-direction: column; gap: 10px">
<div style="align-self: flex-end; max-width: 80%; background: #121A15; color: #FFFFFF; border-radius: 18px 18px 4px 18px; padding: 10px 14px; font-size: 14px; line-height: 1.4">{{sentText}}</div>
<div style="background: #FFFFFF; border-radius: 4px 20px 20px 20px; padding: 14px 14px 10px; display: flex; flex-direction: column; gap: 6px">
<div style="display: flex; align-items: center; gap: 8px; font-size: 13px; color: #56625A">
<span style="width: 26px; height: 26px; border-radius: 13px; background: #DCEFE2; color: #1F5E3A; display: flex; align-items: center; justify-content: center"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l1.8 4.6L18.5 9.5l-4.7 1.9L12 16l-1.8-4.6L5.5 9.5l4.7-1.9Z"></path></svg></span>
Das habe ich erkannt – tippe zum Abwählen:
</div>
<sc-for list="{{aiItems}}" as="item" hint-placeholder-count="3">
<button aria-pressed="{{item.added}}" onClick="{{item.toggle}}" style="display: flex; align-items: center; gap: 12px; width: 100%; min-height: 48px; border: 0; border-top: 1px solid #E6EBE7; background: transparent; padding: 6px 0; text-align: left; cursor: pointer; font-family: 'DM Sans', system-ui, sans-serif; color: #121A15">
<span style="width: 22px; height: 22px; border-radius: 7px; border: {{item.boxBorder}}; background: {{item.boxBg}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; flex-shrink: 0"><svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg></span>
<span style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px"><span style="font-size: 15px; font-weight: 600">{{item.name}}</span><span style="font-size: 12px; color: #56625A">{{item.portion}}</span></span>
<span style="font-size: 14px; font-weight: 700; white-space: nowrap">{{item.kcal}} kcal</span>
</button>
</sc-for>
<button onClick="{{reset}}" style="align-self: flex-start; min-height: 44px; border: 0; background: transparent; padding: 0; color: #1F5E3A; font-family: 'DM Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">Stimmt nicht? Neu eingeben</button>
</div>
</section>
</sc-if>

<sc-if value="{{showList}}" hint-placeholder-val="{{ true }}">
<section aria-label="Zuletzt gegessen" style="display: flex; flex-direction: column; gap: 8px">
<h2 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 18px; font-weight: 700">Zuletzt gegessen</h2>
<div style="background: #FFFFFF; border-radius: 20px; padding: 4px 0">
<sc-for list="{{foods}}" as="item" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 12px; padding: 8px 10px 8px 16px; border-top: {{item.border}}">
<div style="flex-grow: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px">
<div style="font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{item.name}}</div>
<div style="font-size: 12px; color: #56625A">{{item.portion}} · {{item.kcal}} kcal</div>
</div>
<button aria-label="{{item.label}}" aria-pressed="{{item.added}}" onClick="{{item.toggle}}" style="width: 40px; height: 40px; border-radius: 20px; border: {{item.btnBorder}}; background: {{item.btnBg}}; color: {{item.btnFg}}; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0">
<sc-if value="{{item.added}}" hint-placeholder-val="{{ false }}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"></path></svg>
</sc-if>
<sc-if value="{{item.notAdded}}" hint-placeholder-val="{{ true }}">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</sc-if>
</button>
</div>
</sc-for>
</div>
</section>
</sc-if>
</div>

<div style="position: absolute; left: 12px; right: 12px; bottom: 20px">
<button onClick="{{close}}" style="width: 100%; height: 60px; border: 0; border-radius: 22px; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: space-between; padding: 0 22px; cursor: pointer; font-family: 'DM Sans', system-ui, sans-serif; font-size: 16px; font-weight: 700">
<span>{{ctaLabel}}</span><span>{{ctaKcal}}</span>
</button>
</div>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4A","options":["#1F7A4A","#2F5FC4","#D2552F","#121A15"]},"meal":{"editor":null,"default":2},"onClose":{"editor":null},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = {
meal: (props && typeof props.meal === 'number') ? props.meal : 2,
added: {},
text: '',
sentText: '',
aiOff: {}
};
}
renderVals() {
const accent = this.props.accent ?? '#1F7A4A';
const base = [
{ name: 'Haferflocken', portion: '50 g', kcal: 186 },
{ name: 'Banane', portion: '1 Stück (120 g)', kcal: 107 },
{ name: 'Hähnchenbrust', portion: '150 g', kcal: 165 },
{ name: 'Basmatireis, gekocht', portion: '150 g', kcal: 195 },
{ name: 'Magerquark', portion: '250 g', kcal: 168 },
{ name: 'Vollkornbrot', portion: '1 Scheibe (50 g)', kcal: 110 }
];
const aiBase = [
{ name: 'Brötchen', portion: '2 Stück (je 60 g)', kcal: 300 },
{ name: 'Gouda', portion: '2 Scheiben (40 g)', kcal: 145 },
{ name: 'Kaffee mit Milch', portion: '1 Tasse (200 ml)', kcal: 30 }
];
const showChat = this.state.sentText !== '';
let count = 0, sum = 0;
const added = this.state.added;
const foods = base.map((f, i) => {
const on = !!added[i];
if (on) { count += 1; sum += f.kcal; }
return {
...f,
added: on,
notAdded: !on,
label: (on ? 'Entfernen: ' : 'Hinzufügen: ') + f.name,
border: i === 0 ? '0' : '1px solid #E6EBE7',
btnBorder: on ? '0' : '1.5px solid #CBD4CE',
btnBg: on ? accent : 'transparent',
btnFg: on ? '#FFFFFF' : '#121A15',
toggle: () => this.setState({ added: { ...this.state.added, [i]: !this.state.added[i] } })
};
});
const aiItems = aiBase.map((f, i) => {
const on = !this.state.aiOff[i];
if (showChat && on) { count += 1; sum += f.kcal; }
return {
...f,
added: on,
boxBorder: on ? '0' : '1.5px solid #CBD4CE',
boxBg: on ? accent : 'transparent',
toggle: () => this.setState({ aiOff: { ...this.state.aiOff, [i]: !this.state.aiOff[i] } })
};
});
const send = () => {
const t = (this.state.text || '').trim() || '2 Brötchen mit Käse und Kaffee';
this.setState({ sentText: t, text: '', aiOff: {} });
};
const meals = ['Frühstück', 'Mittagessen', 'Abendessen', 'Snacks'];
const out = {
accent, foods, aiItems,
text: this.state.text,
sentText: this.state.sentText,
showChat,
showList: !showChat,
onType: (e) => this.setState({ text: e && e.target ? e.target.value : '' }),
onKey: (e) => { if (e && e.key === 'Enter') { e.preventDefault(); send(); } },
send,
reset: () => this.setState({ sentText: '', aiOff: {} })
};
[0, 1, 2, 3].forEach((i) => {
const on = this.state.meal === i;
out['c' + i] = on ? 'true' : 'false';
out['b' + i] = on ? '#121A15' : 'transparent';
out['f' + i] = on ? '#FFFFFF' : '#56625A';
out['m' + i] = () => this.setState({ meal: i });
});
out.ctaLabel = count === 0 ? 'Zu ' + meals[this.state.meal] + ' hinzufügen' : count + (count === 1 ? ' Eintrag' : ' Einträge') + ' zu ' + meals[this.state.meal];
out.ctaKcal = sum + ' kcal';
out.close = () => { if (typeof this.props.onClose === 'function') this.props.onClose(); };
return out;
}
}
</script>
</body>
</html>
