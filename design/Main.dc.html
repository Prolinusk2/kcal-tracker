<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Heute – Kcal Tracker</title>
<script src="./vendor/react.js"></script>
<script src="./vendor/react-dom.js"></script>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F5E3A}a:hover{color:#123D25}
button,input{font:inherit}
input::placeholder{color:#6B776F}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; background: #EEF1EC; color: #121A15; font-family: 'DM Sans', system-ui, sans-serif; overflow: hidden">

<sc-if value="{{isHome}}" hint-placeholder-val="{{ true }}">
<div style="padding: 50px 20px 0; display: flex; flex-direction: column; gap: 14px">

<header style="display: flex; justify-content: space-between; align-items: center; min-height: 44px">
<div style="display: flex; flex-direction: column; gap: 2px">
<div style="font-size: 13px; font-weight: 500; color: #56625A">{{dateLabel}}</div>
<h1 style="margin: 0; font-family: 'Bricolage Grotesque', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">{{title}}</h1>
</div>
<sc-if value="{{notToday}}" hint-placeholder-val="{{ false }}">
<button onClick="{{backToday}}" style="height: 40px; padding: 0 14px; border-radius: 20px; border: 0; background: #FFFFFF; color: #121A15; font-size: 13px; font-weight: 600; cursor: pointer">Zu heute</button>
</sc-if>
</header>

<nav aria-label="Woche" style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{week}}" as="d" hint-placeholder-count="7">
<button aria-label="{{d.aria}}" aria-pressed="{{d.selected}}" onClick="{{d.pick}}" disabled="{{d.future}}" style="height: 52px; border: {{d.border}}; border-radius: 14px; box-sizing: border-box; background: {{d.bg}}; color: {{d.fgSmall}}; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: {{d.cursor}}; padding: 0"><span style="font-size: 12px; font-weight: 500">{{d.short}}</span><span style="font-size: 15px; font-weight: 700; color: {{d.fg}}">{{d.date}}</span></button>
</sc-for>
</nav>

<section aria-label="Kalorien" style="background: #FFFFFF; border-radius: 26px; padding: 18px; display: flex; flex-direction: column; gap: 16px">
<div style="display: flex; align-items: center; gap: 18px">
<div style="position: relative; width: 136px; height: 136px; flex-shrink: 0">
<svg role="img" aria-label="{{ringAria}}" width="136" height="136" viewBox="0 0 136 136">
<circle cx="68" cy="68" r="58" fill="none" stroke="#E6EBE7" stroke-width="13"></circle>
<circle cx="68" cy="68" r="58" fill="none" stroke="{{ringColor}}" stroke-width="13" stroke-linecap="round" stroke-dasharray="{{ringDash}}" transform="rotate(-90 68 68)"></circle>
</svg>
<div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
<div style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1">{{remValue}}</div>
<div style="font-size: 12px; font-weight: 500; color: #56625A; margin-top: 3px">{{remLabel}}</div>
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px; flex-grow: 1">
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #56625A">Ziel</span><span style="font-size: 16px; font-weight: 700">2.200</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #56625A">Gegessen</span><span style="font-size: 16px; font-weight: 700">{{eaten}}</span></div>
<div style="display: flex; justify-content: space-between; align-items: baseline"><span style="font-size: 13px; color: #56625A">Verbrannt</span><span style="font-size: 16px; font-weight: 700">{{burned}}</span></div>
</div>
</div>

<div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="font-size: 12px; font-weight: 600">Eiweiß</div>
<div style="height: 6px; border-radius: 3px; background: #E6EBE7; overflow: hidden"><div style="width: {{pW}}; height: 6px; border-radius: 3px; background: #2F5FC4"></div></div>
<div style="font-size: 12px; color: #56625A">{{pTxt}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="font-size: 12px; font-weight: 600">Kohlenhydrate</div>
<div style="height: 6px; border-radius: 3px; background: #E6EBE7; overflow: hidden"><div style="width: {{cW}}; height: 6px; border-radius: 3px; background: #E8913A"></div></div>
<div style="font-size: 12px; color: #56625A">{{cTxt}}</div>
</div>
<div style="display: flex; flex-direction: column; gap: 5px">
<div style="font-size: 12px; font-weight: 600">Fett</div>
<div style="height: 6px; border-radius: 3px; background: #E6EBE7; overflow: hidden"><div style="width: {{fW}}; height: 6px; border-radius: 3px; background: #7A4FB8"></div></div>
<div style="font-size: 12px; color: #56625A">{{fTxt}}</div>
</div>
</div>
</section>

<section aria-label="Mahlzeiten" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">

<div style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 36px">
<div style="width: 36px; height: 36px; border-radius: 12px; background: #FCEBD8; color: #9A5412; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
</div>
<sc-if value="{{isToday}}" hint-placeholder-val="{{ true }}">
<button aria-label="Zu Frühstück hinzufügen" onClick="{{open0}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #121A15; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<div style="font-size: 15px; font-weight: 600">Frühstück</div>
<div style="font-size: 12px; color: #56625A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 700; color: #121A15">{{k0}}</span>{{s0}}</div>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 36px">
<div style="width: 36px; height: 36px; border-radius: 12px; background: #DCEFE2; color: #1F5E3A; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11h18a9 9 0 0 1-18 0Z"></path><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"></path></svg>
</div>
<sc-if value="{{isToday}}" hint-placeholder-val="{{ true }}">
<button aria-label="Zu Mittagessen hinzufügen" onClick="{{open1}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #121A15; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<div style="font-size: 15px; font-weight: 600">Mittagessen</div>
<div style="font-size: 12px; color: #56625A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 700; color: #121A15">{{k1}}</span>{{s1}}</div>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 36px">
<div style="width: 36px; height: 36px; border-radius: 12px; background: #E4E2F4; color: #4A3E8F; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"></path></svg>
</div>
<sc-if value="{{isToday}}" hint-placeholder-val="{{ true }}">
<button aria-label="Zu Abendessen hinzufügen" onClick="{{open2}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #121A15; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<div style="font-size: 15px; font-weight: 600">Abendessen</div>
<div style="font-size: 12px; color: #56625A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 700; color: #121A15">{{k2}}</span>{{s2}}</div>
</div>
</div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 12px; display: flex; flex-direction: column; gap: 8px">
<div style="display: flex; justify-content: space-between; align-items: center; min-height: 36px">
<div style="width: 36px; height: 36px; border-radius: 12px; background: #F7E1E4; color: #9B2C3D; display: flex; align-items: center; justify-content: center">
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8c-3-2-8-1-8 4 0 5 4 9 6 9 1 0 1.3-.5 2-.5s1 .5 2 .5c2 0 6-4 6-9 0-5-5-6-8-4Z"></path><path d="M12 8c0-2 1-4 3-5"></path></svg>
</div>
<sc-if value="{{isToday}}" hint-placeholder-val="{{ true }}">
<button aria-label="Zu Snacks hinzufügen" onClick="{{open3}}" style="width: 36px; height: 36px; border-radius: 18px; border: 0; background: #121A15; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</sc-if>
</div>
<div style="display: flex; flex-direction: column; gap: 1px; min-width: 0">
<div style="font-size: 15px; font-weight: 600">Snacks</div>
<div style="font-size: 12px; color: #56625A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span style="font-weight: 700; color: #121A15">{{k3}}</span>{{s3}}</div>
</div>
</div>
</section>

<sc-if value="{{notToday}}" hint-placeholder-val="{{ false }}">
<div style="display: flex; align-items: center; justify-content: center; gap: 6px; font-size: 12px; color: #56625A">
<svg aria-hidden="true" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg>
Abgeschlossen – nicht mehr bearbeitbar
</div>
</sc-if>

</div>

<nav aria-label="Hauptmenü" style="position: absolute; left: 12px; right: 12px; bottom: 20px; height: 68px; border-radius: 24px; background: #121A15; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); align-items: center; padding: 0 6px; box-sizing: border-box">
<div style="display: flex; justify-content: center">
<button aria-label="Essen hinzufügen" onClick="{{openFab}}" style="width: 54px; height: 54px; border-radius: 19px; border: 0; background: {{accent}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg aria-hidden="true" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg>
</button>
</div>
<button aria-current="page" onClick="{{backToday}}" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #FFFFFF; font-size: 11px; font-weight: 600; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1Z"></path></svg>Heute</button>
<button onClick="{{goDiary}}" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3AFA7; font-size: 11px; font-weight: 500; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h11a3 3 0 0 1 3 3v13H8a3 3 0 0 1-3-3Z"></path><path d="M9 9h6M9 13h6"></path></svg>Tagebuch</button>
<button onClick="{{goSettings}}" style="height: 56px; border: 0; background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: #A3AFA7; font-size: 11px; font-weight: 500; cursor: pointer">
<svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1Z"></path></svg><span style="font-size: 10px; white-space: nowrap">Einstellungen</span></button>
</nav>
</sc-if>

<sc-if value="{{isDiary}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0">
<dc-import name="Tagebuch" accent="{{accent}}" on-home="{{goHome}}" on-add="{{openFromDiary}}" on-settings="{{goSettings}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>

<sc-if value="{{isSettings}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0">
<dc-import name="Einstellungen" accent="{{accent}}" on-home="{{goHome}}" on-diary="{{goDiary}}" on-add="{{openFromSettings}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>

<sc-if value="{{isAdd}}" hint-placeholder-val="{{ false }}">
<div style="position: absolute; inset: 0">
<dc-import name="Essen" meal="{{meal}}" accent="{{accent}}" on-close="{{close}}" hint-size="390px,844px"></dc-import>
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#1F7A4A","options":["#1F7A4A","#2F5FC4","#D2552F","#121A15"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { screen: 'home', meal: 2, back: 'home', day: 10 };
}
renderVals() {
const accent = this.props.accent ?? '#1F7A4A';
const GOAL = 2200;
const TODAY = 10;
const fmt = (n) => n.toLocaleString('de-DE');
const days = [
{ d: 5, short: 'Mo', long: 'Montag', burned: 180, meals: [['Müsli mit Joghurt', 480], ['Spaghetti Bolognese', 720], ['Vollkornbrot mit Käse', 560], ['Apfel, Walnüsse', 290]] },
{ d: 6, short: 'Di', long: 'Dienstag', burned: 350, meals: [['Rührei, Toast', 430], ['Döner', 820], ['Lachs, Kartoffeln', 490], ['Schokolade, Cappuccino, Riegel', 570]] },
{ d: 7, short: 'Mi', long: 'Mittwoch', burned: 0, meals: [['Haferflocken, Banane', 386], ['Hähnchen-Wrap', 540], ['Gemüsecurry mit Reis', 690], ['Magerquark, Beeren, Mandeln', 304]] },
{ d: 8, short: 'Do', long: 'Donnerstag', burned: 260, meals: [['Brötchen mit Marmelade', 380], ['Schnitzel mit Pommes', 980], ['Salat mit Feta', 420], ['Apfel, Studentenfutter, Latte', 400]] },
{ d: 9, short: 'Fr', long: 'Freitag', burned: 120, meals: [['Croissant, Kaffee', 490], ['Burger mit Pommes', 1050], ['Pizza Margherita', 640], ['Bier', 220]] },
{ d: 10, short: 'Sa', long: 'Samstag', burned: 220, macros: [68, 132, 41], meals: [['Haferflocken, Banane', 420], ['Hähnchen, Reis, Brokkoli', 760], null, null] },
{ d: 11, short: 'So', long: 'Sonntag', future: true, burned: 0, meals: [null, null, null, null] }
];
const sel = this.state.day;
const week = days.map((x) => {
const isSel = x.d === sel;
const isToday = x.d === TODAY;
return {
short: x.short,
date: x.d,
future: !!x.future,
selected: isSel,
aria: x.long + ', ' + x.d + '. Oktober' + (isToday ? ' (heute)' : ''),
bg: isSel ? '#121A15' : 'transparent',
fg: isSel ? '#FFFFFF' : (x.future ? '#9AA59E' : '#121A15'),
fgSmall: isSel ? '#C9D3CC' : '#56625A',
border: (isToday && !isSel) ? '1.5px dashed #56625A' : '0',
cursor: x.future ? 'default' : 'pointer',
pick: () => { if (!x.future) this.setState({ day: x.d }); }
};
});
const day = days.find((x) => x.d === sel) || days[5];
const isToday = sel === TODAY;
const eaten = day.meals.reduce((s, m) => s + (m ? m[1] : 0), 0);
const budget = GOAL + day.burned;
const rem = budget - eaten;
const C = 364.4;
const frac = Math.min(1, eaten / budget);
const macros = day.macros || [Math.round(eaten * 0.2 / 4), Math.round(eaten * 0.5 / 4), Math.round(eaten * 0.3 / 9)];
const targets = [140, 250, 70];
const pct = (v, t) => Math.min(100, Math.round(v / t * 100)) + '%';
const out = {
accent,
week,
isToday,
notToday: !isToday,
title: isToday ? 'Heute' : day.long,
dateLabel: (isToday ? 'Samstag' : day.long) + ', ' + sel + '. Oktober',
eaten: fmt(eaten),
burned: day.burned ? '+' + fmt(day.burned) : '0',
remValue: fmt(Math.abs(rem)),
remLabel: rem >= 0 ? 'kcal übrig' : 'kcal drüber',
ringColor: rem >= 0 ? accent : '#D9822B',
ringDash: (frac * C).toFixed(1) + ' ' + C,
ringAria: fmt(eaten) + ' von ' + fmt(budget) + ' kcal gegessen',
pW: pct(macros[0], targets[0]), pTxt: macros[0] + ' / 140 g',
cW: pct(macros[1], targets[1]), cTxt: macros[1] + ' / 250 g',
fW: pct(macros[2], targets[2]), fTxt: macros[2] + ' / 70 g',
isHome: this.state.screen === 'home',
isDiary: this.state.screen === 'diary',
isAdd: this.state.screen === 'add',
isSettings: this.state.screen === 'settings',
goSettings: () => this.setState({ screen: 'settings' }),
openFromSettings: (m) => this.setState({ screen: 'add', meal: typeof m === 'number' ? m : 2, back: 'settings' }),
meal: this.state.meal,
backToday: () => this.setState({ day: TODAY }),
goDiary: () => this.setState({ screen: 'diary' }),
goHome: () => this.setState({ screen: 'home' }),
openFromDiary: (m) => this.setState({ screen: 'add', meal: typeof m === 'number' ? m : 2, back: 'diary' }),
openFab: () => this.setState({ screen: 'add', meal: 2, back: 'home', day: TODAY }),
close: () => this.setState({ screen: this.state.back || 'home' })
};
[0, 1, 2, 3].forEach((i) => {
const m = day.meals[i];
out['k' + i] = m ? fmt(m[1]) + ' kcal' : '';
out['s' + i] = m ? ' · ' + m[0] : (isToday ? 'Noch leer' : 'Nichts eingetragen');
out['open' + i] = () => this.setState({ screen: 'add', meal: i, back: 'home' });
});
return out;
}
}
</script>
</body>
</html>
